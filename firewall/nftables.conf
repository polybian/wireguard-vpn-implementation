# nftables firewall for the WireGuard server.
# __WAN_IF__ is replaced by scripts/deploy-server.sh with the real egress iface.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
        ct state { established, related } accept
        udp dport 51820 accept comment "WireGuard"
        tcp dport 22 accept comment "SSH admin"
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
        iifname "wg0" oifname "__WAN_IF__" accept comment "VPN clients -> internet"
        iifname "__WAN_IF__" oifname "wg0" ct state { established, related } accept
    }
    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table inet nat {
    chain postrouting {
        type nat hook postrouting priority 100; policy accept;
        oifname "__WAN_IF__" ip saddr 10.8.0.0/24 masquerade comment "NAT VPN clients"
    }
}
