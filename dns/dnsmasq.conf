# dnsmasq - internal DNS for VPN clients.
# Listens only on the WireGuard interface address; authoritative for corp.local.

interface=wg0
listen-address=10.8.0.1
bind-interfaces

# Internal zone - VPN-only names
address=/vpn.corp.local/10.8.0.1
address=/fileserver.corp.local/10.8.0.10
address=/printer.corp.local/10.8.0.20

# Upstream resolvers for everything else
server=1.1.1.1
server=9.9.9.9

# Hygiene
domain-needed
bogus-priv
no-resolv
cache-size=1000
log-queries
