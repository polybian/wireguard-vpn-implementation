# dnsmasq — internal DNS for VPN clients.
# Listens only on the WireGuard interface address; authoritative for lab.local.

interface=wg0
listen-address=10.8.0.1
bind-interfaces

# Internal zone — VPN-only names
address=/vpn.lab.local/10.8.0.1
address=/fileserver.lab.local/10.8.0.10
address=/printer.lab.local/10.8.0.20

# Upstream resolvers for everything else
server=1.1.1.1
server=9.9.9.9

# Hygiene
domain-needed
bogus-priv
no-resolv
cache-size=1000
log-queries
